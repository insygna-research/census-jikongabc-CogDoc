name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: dtolnay/rust-toolchain@stable

      # 复用 HuggingFace 缓存，避免每次重新下载 BGE 嵌入/精排模型。
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 不固定到 PyTorch CPU 专用源：download-r2.pytorch.org 在 GitHub runner 上偶发 TLS 握手失败。
          # 直接走 PyPI 解析 pyproject 依赖，避免 CI 被外部镜像单点阻断。
          pip install -e ".[dev]"

      - name: Build and install rust_core
        run: |
          # CI 无激活 venv，maturin develop 会报错；改为 build wheel 再装。
          cd rust_core && maturin build --release --out dist
          pip install dist/*.whl

      - name: Run tests
        run: pytest -q
